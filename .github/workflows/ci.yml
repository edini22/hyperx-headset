name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} (ruff, tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests
        run: >-
          pytest --junitxml=reports/junit.xml --cov --cov-report=term
          --cov-report=xml:reports/coverage.xml --cov-report=html:reports/coverage-html
      - name: Test and coverage summary
        if: ${{ !cancelled() }}
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          python scripts/test-summary.py reports/junit.xml "Tests on Python $PYTHON_VERSION" >> "$GITHUB_STEP_SUMMARY"
          { echo '#### Coverage'; echo; coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports-python-${{ matrix.python }}
          path: reports/

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - run: shellcheck --version
      - run: shellcheck install.sh tests/headless/run.sh scripts/*.sh

  extension:
    name: Extension and docs (oxlint, oxfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: python3 -m json.tool extension/*/metadata.json > /dev/null

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-version.sh
      - run: scripts/release-notes.sh "$(scripts/check-version.sh)" > /dev/null
