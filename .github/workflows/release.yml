name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the version
        run: scripts/check-version.sh "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
